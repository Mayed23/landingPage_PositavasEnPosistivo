{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Positivas en Positivo{% endblock %}</title>

    <meta name="description" content="Un espacio para compartir historias, experiencias y resiliencia.">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

    <header>
        <nav>
            <a href="{% url 'home' %}" class="logo">
                Positivas en Positivo
            </a>

            <ul>
                <li><a href="{% url 'home' %}#inicio">Inicio</a></li>
                <li><a href="{% url 'home' %}#historia">Nuestra historia</a></li>
                <li><a href="{% url 'home' %}#comunidad">Comunidad</a></li>
                <li><a href="{% url 'home' %}#journals">Journals</a></li>
                <li><a href="{% url 'home' %}#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>© 2026 Positivas en Positivo. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
